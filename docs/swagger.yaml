basePath: /
definitions:
  auth.JSONWebKey:
    properties:
      active:
        description: Extension parameter (RFC 7517 Section 4 allows extension members)
        type: boolean
      alg:
        description: 'Algorithm: "RS256", "ES256", "EdDSA", etc.'
        type: string
      crv:
        description: EC parameters (RFC 7518 Section 6.2)
        type: string
      e:
        description: Exponent (base64url unpadded)
        type: string
      kid:
        description: Key ID
        type: string
      kty:
        description: 'Key Type: "RSA", "EC", "OKP"'
        type: string
      "n":
        description: RSA parameters (RFC 7518 Section 6.3)
        type: string
      use:
        description: 'Public Key Use: "sig"'
        type: string
      x:
        description: X coordinate (EC) or public key bytes (OKP)
        type: string
      "y":
        description: Y coordinate (EC)
        type: string
    type: object
  auth.PublicKeyEntry:
    properties:
      active:
        description: |-
          Active reports whether IAM is still signing with this key. During a rotation window both the
          new (active) and the previous (verification-only) key are published.
        type: boolean
      algorithm:
        description: Algorithm is the JWS algorithm the key is used with (e.g. ES256).
        type: string
      key_id:
        description: KeyID matches the `kid` header of the tokens the key signs.
        type: string
      public_key:
        description: PublicKey is the PEM-encoded public key.
        type: string
    type: object
