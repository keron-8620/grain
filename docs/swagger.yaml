      protocol:
        example: ssh
        type: string
      py_path:
        example: /usr/bin/python3
        type: string
      remark:
        example: web server
        type: string
      ssh_host_key_fingerprint:
        description: |-
          SSHHostKeyFingerprint identifies the pinned SSH host key; empty when the
          host was created without SSH onboarding.
        example: SHA256:abc...
        type: string
      updated_at:
        type: string
    type: object
