info:
  contact: {}
  description: grain 运营管控平台 API 接口文档
  title: grain API
  version: "1.0"
paths:
  /.well-known/jwks.json:
    get:
      description: 返回标准 JWKS (JSON Web Key Set) 格式的公钥集合
      produces:
      - application/json
      responses:
        "200":
          description: JWKS获取成功
          schema:
            $ref: '#/definitions/iam.JSONWebKeySet'
        "500":
          description: 服务器配置异常
          schema:
            $ref: '#/definitions/iam.Response'
      summary: 获取 RFC 7517 标准 JWKS 公钥集
      tags:
      - IAM/认证管理
  /api/v1/apis:
    get:
      description: 支持按路径、请求方法、标签过滤及分页排序
      parameters:
      - description: 页码 (默认1)
        in: query
        name: page
        type: integer
      - description: 每页数量 (默认20, 最大100)
        in: query
        name: page_size
        type: integer
      - description: 路由路径模糊匹配
        in: query
        name: url
        type: string
      - description: HTTP方法 (GET, POST等)
        in: query
        name: method
        type: string
      - description: 接口标签模糊匹配
        in: query
        name: label
        type: string
      - description: 排序规则
        in: query
        name: order_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/iam.Response'
            - properties:
                data:
                  $ref: '#/definitions/iam.ApiPageResult'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/iam.Response'
        "403":
          description: 无操作权限
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      security:
      - BearerAuth: []
      summary: 分页查询 API 列表
      tags:
      - IAM/接口管理
    post:
      consumes:
      - application/json
      description: 注册新的 API 路由端点到权限目录并自动在 Casbin 中生成基础访问策略
      parameters:
      - description: 创建API参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/iam.CreateApiReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/iam.Response'
            - properties:
                data:
                  $ref: '#/definitions/grain_internal_service_iam.Api'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/iam.Response'
        "403":
          description: 无操作权限
          schema:
            $ref: '#/definitions/iam.Response'
        "409":
          description: 该API路由已存在
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      security:
      - BearerAuth: []
      summary: 创建 API 接口资源
      tags:
      - IAM/接口管理
  /api/v1/apis/{id}:
    delete:
      description: 删除指定 API 路由记录并级联清理对应的 Casbin 策略规则
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/iam.Response'
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/iam.Response'
        "403":
          description: 无操作权限
          schema:
            $ref: '#/definitions/iam.Response'
        "404":
          description: API不存在
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      security:
      - BearerAuth: []
      summary: 删除 API 接口资源
      tags:
      - IAM/接口管理
    get:
      description: 根据主键获取 API 资源定义及说明
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/iam.Response'
            - properties:
                data:
                  $ref: '#/definitions/grain_internal_service_iam.Api'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/iam.Response'
        "403":
          description: 无操作权限
          schema:
            $ref: '#/definitions/iam.Response'
        "404":
          description: API不存在
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      security:
      - BearerAuth: []
      summary: 获取 API 接口详情
      tags:
      - IAM/接口管理
    put:
      consumes:
      - application/json
      description: 更新 API 路径、请求方法或标签，并自动同步更新 Casbin 策略规则
      parameters:
      - description: API ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新API参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/iam.UpdateApiReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/iam.Response'
            - properties:
                data:
                  $ref: '#/definitions/grain_internal_service_iam.Api'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/iam.Response'
        "403":
          description: 无操作权限
          schema:
            $ref: '#/definitions/iam.Response'
        "404":
          description: API不存在
          schema:
            $ref: '#/definitions/iam.Response'
        "409":
          description: 该API路由已被其他记录使用
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      security:
      - BearerAuth: []
      summary: 更新 API 接口资源
      tags:
      - IAM/接口管理
  /api/v1/apis/sync:
    post:
      consumes:
      - application/json
      description: 批量导入系统当前实际注册的路由清单，新增未知路由并初始化 Casbin 策略
      parameters:
      - description: 路由列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/iam.SyncApisReq'
      produces:
      - application/json
      responses:
        "200":
          description: 同步成功
          schema:
            allOf:
            - $ref: '#/definitions/iam.Response'
            - properties:
                data:
                  $ref: '#/definitions/iam.SyncApisResp'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/iam.Response'
        "403":
          description: 无操作权限
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      security:
      - BearerAuth: []
      summary: 批量同步 API 路由
      tags:
      - IAM/接口管理
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 用户通过用户名与密码凭证换取访问令牌与刷新令牌
      parameters:
      - description: 登录凭证
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/iam.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/iam.Response'
            - properties:
                data:
                  $ref: '#/definitions/iam.LoginResp'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/iam.Response'
        "403":
          description: 账号已被锁定/禁用
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      summary: 用户登录
      tags:
      - IAM/认证管理
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 撤销当前用户的登录凭证，使当前刷新令牌和所有旧访问令牌失效
      parameters:
      - description: 可选刷新令牌
        in: body
        name: request
        schema:
          $ref: '#/definitions/iam.LogoutReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - IAM/认证管理
  /api/v1/auth/me:
    get:
      description: 从当前访问令牌中提取用户上下文并返回用户详情与关联角色
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/iam.Response'
            - properties:
                data:
                  $ref: '#/definitions/grain_internal_service_iam.User'
              type: object
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/iam.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      security:
      - BearerAuth: []
      summary: 获取当前登录用户信息
      tags:
      - IAM/认证管理
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用有效的刷新令牌 (Refresh Token) 换取新的访问令牌与刷新令牌 (Token Rotation)
      parameters:
      - description: 刷新令牌请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/iam.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/iam.Response'
            - properties:
                data:
                  $ref: '#/definitions/grain_internal_service_iam.TokenPair'
              type: object
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/iam.Response'
        "401":
          description: 刷新令牌无效或已过期
          schema:
            $ref: '#/definitions/iam.Response'
        "500":
          description: 内部服务异常
          schema:
            $ref: '#/definitions/iam.Response'
      summary: 刷新访问凭证
      tags:
      - IAM/认证管理
  /api/v1/buttons:
    get:
      description: 支持按名称、所属菜单ID、状态过滤及分页排序
      parameters:
      - description: 页码 (默认1)
        in: query
        name: page
        type: integer
      - description: 每页数量 (默认20, 最大100)
        in: query
        name: page_size
        type: integer
      - description: 按钮名称模糊匹配
        in: query
        name: name
        type: string
